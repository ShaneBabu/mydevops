services:

  mydevops:
    image: mydevops-app:v1
    container_name: mydevops-app
    ports:
      - "8083:8080"
    depends_on:
      - devopsdb

  devopsdb:
    image: mydevops-db:v1
    container_name: devops-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: devopspassword
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
